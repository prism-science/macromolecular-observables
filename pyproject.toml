[build-system]
requires = ["setuptools>=61.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm_observables"
dynamic = ["version"]
description = "Tools and APIs for working with protein coordinates, ensembles, and measurements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Marcus D. Collins", email = "marcus.collins@astera.org" }
]
keywords = ["protein", "measurement", "machine-learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "biotite",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
]

wandb = [
    "wandb>=0.22.3",
]

CI = [
    "ruff",
    "pre-commit>=4.0.0",
    "mypy>=1.20.1",
]

[project.urls]
Homepage = "https://github.com/diff-use/macromolecular-observables"
Repository = "https://github.com/diff-use/macromolecular-observables"
Issues = "https://github.com/diff-use/macromolecular-observables/issues"

# --- Ruff Linting Configuration ---
[tool.mypy]
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 88

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["mm_observables"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
